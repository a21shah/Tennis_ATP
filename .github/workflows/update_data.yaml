name: Download ATP Data

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to download'
        required: false
        type: number
  schedule:
    - cron: "0 6 * * 1"   # Mondays 6:00am Toronto time
      timezone: 'America/Toronto'

permissions:
  contents: write

env:
  YEAR: ${{ inputs.year || 2026 }}   # inputs is empty on schedule runs, so this falls back to 2026

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download CSV
        run: |
          set -euo pipefail
          mkdir -p matches_data
          URL=$(curl -fsSL 'https://stats.tennismylife.org/api/data-files' \
            | jq -r --arg n "${YEAR}.csv" '.files[] | select(.name == $n) | .url')
          echo "Downloading: $URL"
          test -n "$URL"
          curl -fsSL "$URL" -o "matches_data/atp_matches_${YEAR}.csv"
          test -s "matches_data/atp_matches_${YEAR}.csv"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "matches_data/atp_matches_${YEAR}.csv"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update ATP matches ${YEAR} ($(date -u +%F))"
            git push
          fi